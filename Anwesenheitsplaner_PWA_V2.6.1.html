<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An-/Abwesenheitsplaner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1e293b;
            --border-color: #cbd5e1;
            --weekend-bg: #fee2e2;
            --weekend-text: #991b1b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .top-bar {
            display: flex;
            gap: 15px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            align-items: center;
        }

        .status-toolbar {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .status-btn {
            padding: 6px 12px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .status-btn.active {
            border-color: #000;
            transform: scale(1.04);
        }

        .table-container {
            max-height: 70vh;
            overflow: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 12px;
        }

        th, td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 0;
            white-space: nowrap;
        }

        thead tr:nth-child(1) th { position: sticky; top: 0; z-index: 10; }
        thead tr:nth-child(2) th { position: sticky; top: 22px; z-index: 10; }
        thead tr:nth-child(3) th { position: sticky; top: 44px; z-index: 10; }

        th.col-sticky-1, td.col-sticky-1 {
            position: sticky;
            left: 0;
            z-index: 5;
            background: #f8fafc;
            width: 160px;
            min-width: 160px;
            text-align: left;
            padding-left: 8px;
            font-weight: 600;
        }

        thead tr th.col-sticky-1 { z-index: 15; background: #e2e8f0; }

        th.header-kw { background: #cbd5e1; height: 22px; font-weight: 700; font-size: 11px; }
        th.header-day { background: #f1f5f9; height: 22px; font-weight: 500; font-size: 11px; }
        th.header-num { background: #e2e8f0; height: 22px; font-weight: 700; }

        td.day-cell {
            width: 28px;
            min-width: 28px;
            height: 36px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        /* Nur noch für Sonntage verwendet */
        .weekend {
            background-color: var(--weekend-bg) !important;
            color: var(--weekend-text) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <label>Monat:
            <select id="monthSelect">
                <option value="0">Januar</option>
                <option value="1">Februar</option>
                <option value="2">März</option>
                <option value="3">April</option>
                <option value="4">Mai</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7" selected>August</option>
                <option value="8">September</option>
                <option value="9">Oktober</option>
                <option value="10">November</option>
                <option value="11">Dezember</option>
            </select>
        </label>
        <label>Jahr:
            <select id="yearSelect">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>
        </label>
    </div>

    <div class="status-toolbar" id="statusToolbar">
        <button class="status-btn active" data-status="OFFICE" style="background:#e0f2fe; color:#0369a1;">Office (O)</button>
        <button class="status-btn" data-status="HOME" style="background:#dcfce7; color:#15803d;">Home Office (HO)</button>
        <button class="status-btn" data-status="VACATION" style="background:#fef3c7; color:#b45309;">Urlaub (U)</button>
        <button class="status-btn" data-status="ILLNESS" style="background:#fee2e2; color:#b91c1c;">Krank (K)</button>
        <button class="status-btn" data-status="CLEAR" style="background:#f1f5f9; color:#475569;">Löschen (-)</button>
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead>
                <tr id="headerKW">
                    <th class="col-sticky-1"></th>
                </tr>
                <tr id="headerDays">
                    <th class="col-sticky-1">Mitarbeiter</th>
                </tr>
                <tr id="headerDates">
                    <th class="col-sticky-1">Datum</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cahhwvqdebadiietbufz.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhaGh3dnFkZWJhZGlpZXRidWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzY4OTksImV4cCI6MjEwMzcxMjg5OX0.z4M1IHOhVYGDg6vWovIWRPiDgHgpjVNT0auDLKFoyu0';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeStatus = 'OFFICE';
    let aktuellePlanungsDaten = {};

    let MITARBEITER_LISTE = [
        { id: "emp_1", name: "Krüger, Daniela" },
        { id: "emp_2", name: "de Fuchs, Ana" },
        { id: "emp_3", name: "Stark, Isolde" },
        { id: "emp_4", name: "Förderer, Aliya" },
        { id: "emp_5", name: "Straub, Franziska" }
    ];

    let STATUS_CONFIG = {
        'OFFICE': { label: 'O', bg: '#e0f2fe', color: '#0369a1' },
        'HOME': { label: 'HO', bg: '#dcfce7', color: '#15803d' },
        'VACATION': { label: 'U', bg: '#fef3c7', color: '#b45309' },
        'ILLNESS': { label: 'K', bg: '#fee2e2', color: '#b91c1c' },
        'CLEAR': { label: '', bg: '', color: '' }
    };

    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const tableBody = document.getElementById('tableBody');
    const headerKW = document.getElementById('headerKW');
    const headerDays = document.getElementById('headerDays');
    const headerDates = document.getElementById('headerDates');

    document.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            activeStatus = e.currentTarget.dataset.status;
        });
    });

    monthSelect.addEventListener('change', () => renderTabelle());
    yearSelect.addEventListener('change', () => renderTabelle());

    // Berechnet die ISO-Kalenderwoche
    function getISOWeek(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    async function speichereDatenZentral(planungsDaten) {
        try {
            await supabaseClient.from('anwesenheiten').upsert({
                id: 'planung',
                eintraege: { eintraege: planungsDaten, mitarbeiter: MITARBEITER_LISTE, statusConfig: STATUS_CONFIG },
                updated_at: new Date().toISOString()
            });
        } catch (err) {
            console.error("Speicherfehler:", err);
        }
    }

    async function ladeZentraleDaten() {
        try {
            const { data } = await supabaseClient.from('anwesenheiten').select('eintraege').eq('id', 'planung').single();
            if (data && data.eintraege) {
                aktuellePlanungsDaten = data.eintraege.eintraege || {};
            }
        } catch (err) {
            console.error("Ladefehler:", err);
        }
        renderTabelle();
    }

    function renderTabelle() {
        const year = parseInt(yearSelect.value);
        const month = parseInt(monthSelect.value);
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        headerKW.innerHTML = '<th class="col-sticky-1"></th>';
        headerDays.innerHTML = '<th class="col-sticky-1">Mitarbeiter</th>';
        headerDates.innerHTML = '<th class="col-sticky-1">Datum</th>';

        const dayNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

        let currentKW = null;
        let currentKwTh = null;

        // 1. Header generieren (KW, Wochentag, Tag-Nummer)
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, month, d);
            const dayOfWeek = dateObj.getDay(); 
            const isSunday = (dayOfWeek === 0); // NUR Sonntag wird rot markiert

            // KW-Zeile gruppieren
            const kw = getISOWeek(dateObj);
            if (kw !== currentKW) {
                currentKW = kw;
                currentKwTh = document.createElement('th');
                currentKwTh.className = 'header-kw';
                currentKwTh.textContent = `KW ${kw}`;
                currentKwTh.colSpan = 1;
                headerKW.appendChild(currentKwTh);
            } else {
                currentKwTh.colSpan += 1;
            }

            // Wochentag Header (Sa, So, Mo...)
            const thDay = document.createElement('th');
            thDay.className = `header-day ${isSunday ? 'weekend' : ''}`;
            thDay.textContent = dayNames[dayOfWeek];
            headerDays.appendChild(thDay);

            // Datums-Header (1, 2, 3...)
            const thNum = document.createElement('th');
            thNum.className = `header-num ${isSunday ? 'weekend' : ''}`;
            thNum.textContent = d;
            headerDates.appendChild(thNum);
        }

        // 2. Tabellenzellen für Mitarbeiter generieren
        tableBody.innerHTML = '';
        MITARBEITER_LISTE.forEach(emp => {
            const tr = document.createElement('tr');

            const tdName = document.createElement('td');
            tdName.className = 'col-sticky-1';
            tdName.textContent = emp.name;
            tr.appendChild(tdName);

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const isSunday = (dateObj.getDay() === 0); // NUR Sonntag ist rot
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const key = `${emp.id}_${dateStr}`;

                const tdCell = document.createElement('td');
                tdCell.className = `day-cell ${isSunday ? 'weekend' : ''}`;

                const statusVal = aktuellePlanungsDaten[key];
                if (statusVal && STATUS_CONFIG[statusVal]) {
                    const cfg = STATUS_CONFIG[statusVal];
                    tdCell.textContent = cfg.label;
                    tdCell.style.backgroundColor = cfg.bg;
                    tdCell.style.color = cfg.color;
                }

                tdCell.addEventListener('click', () => {
                    if (activeStatus === 'CLEAR') {
                        delete aktuellePlanungsDaten[key];
                    } else {
                        aktuellePlanungsDaten[key] = activeStatus;
                    }
                    renderTabelle();
                    speichereDatenZentral(aktuellePlanungsDaten);
                });

                tr.appendChild(tdCell);
            }
            tableBody.appendChild(tr);
        });
    }

    document.addEventListener("DOMContentLoaded", ladeZentraleDaten);
</script>

</body>
</html>
